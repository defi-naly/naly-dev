<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What I'm Buying While You Panic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 480px;
      overflow: hidden;
      position: relative;
      background: #050608;
    }

    .bg-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      opacity: 0.5;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(5, 6, 8, 0.2) 0%,
        rgba(5, 6, 8, 0.55) 50%,
        rgba(5, 6, 8, 0.85) 100%
      );
    }

    .vignette {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      box-shadow: inset 0 0 200px rgba(5, 6, 8, 0.5);
    }

    .content {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .line1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 42px;
      font-weight: 500;
      color: rgba(220, 228, 240, 0.6);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 8px;
      text-align: center;
    }

    .line2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 140px;
      font-weight: 700;
      color: #f0efe9;
      letter-spacing: -0.05em;
      line-height: 0.88;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 28px;
      text-align: center;
    }

    .line2 .panic {
      color: #ee4444;
    }

    .handle {
      position: absolute;
      top: 40px;
      right: 64px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: rgba(220, 228, 240, 0.3);
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <img src="1080x360.jpeg" class="bg-img" alt="">
  <div class="overlay"></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="line1">What I'm Buying While You</div>
    <div class="line2">PANIC<span style="color: rgba(220,228,240,0.15); font-size: 36px; font-weight: 400; letter-spacing: 0.02em;">.</span></div>
  </div>

  <div class="handle">@defi_naly</div>
</body>
</html>
