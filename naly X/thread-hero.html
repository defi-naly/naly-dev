<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three Things Survive — @defi_naly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #08090c;
      --soil: #0f1014;
      --surface: #161819;
      --border: #1e1c1a;
      --bright: #f0efe9;
      --text: #d4cfc4;
      --muted: #a69b8a;
      --dim: #6b6560;
      --accent: #7ba3c9;
      --accent-bright: #96bade;
      --accent-glow: rgba(123, 163, 201, 0.3);
      --snow: #e8edf4;
      --peak: #b8c4d4;
      --gold: #c9a84c;
      --display: 'Space Grotesk', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--void);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 32px;
    }

    .bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      pointer-events: none;
    }

    .bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0.2;
    }

    .bg-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8, 9, 12, 0.55);
    }

    .card {
      position: relative;
      z-index: 1;
      width: 1200px;
      height: 675px;
      background: rgba(15, 16, 20, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(123, 163, 201, 0.1);
      border-radius: 16px;
      padding: 44px 52px 40px;
      overflow: hidden;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(123, 163, 201, 0.25), transparent);
    }

    .card-label {
      position: absolute;
      top: 44px;
      left: 52px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .venn-container {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
    }

    .venn-container svg {
      width: 480px;
      height: 420px;
    }

    .venn-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .venn-center-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .quote-main {
      font-family: var(--display);
      font-size: 30px;
      font-weight: 600;
      color: var(--bright);
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .watermark {
      position: absolute;
      bottom: 40px;
      right: 52px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.6;
    }
  </style>
</head>
<body>

<div class="bg">
  <img src="1080x360.jpeg" alt="">
  <div class="bg-overlay"></div>
</div>

<div class="card">
  <div class="card-label">Thread</div>

  <div class="venn-container">
    <svg viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="12" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="12" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="glow-snow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="12" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="text-glow-blue" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="text-glow-gold" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="text-glow-snow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- APIs circle — top left -->
      <circle cx="185" cy="165" r="135" fill="rgba(123, 163, 201, 0.12)" stroke="rgba(123, 163, 201, 0.45)" stroke-width="1.5" filter="url(#glow-blue)"/>

      <!-- Money circle — top right -->
      <circle cx="295" cy="165" r="135" fill="rgba(201, 168, 76, 0.12)" stroke="rgba(201, 168, 76, 0.45)" stroke-width="1.5" filter="url(#glow-gold)"/>

      <!-- AI circle — bottom center -->
      <circle cx="240" cy="265" r="135" fill="rgba(184, 196, 212, 0.12)" stroke="rgba(184, 196, 212, 0.45)" stroke-width="1.5" filter="url(#glow-snow)"/>

      <!-- Labels — inside each circle's open area -->
      <text x="125" y="110" text-anchor="middle" class="venn-label" fill="#96bade" filter="url(#text-glow-blue)">APIs</text>
      <text x="355" y="110" text-anchor="middle" class="venn-label" fill="#e2c76e" filter="url(#text-glow-gold)">Money</text>
      <text x="240" y="385" text-anchor="middle" class="venn-label" fill="#d0daea" filter="url(#text-glow-snow)">AI</text>

      <!-- Center intersection label -->
      <text x="240" y="200" text-anchor="middle" class="venn-center-label" fill="#f0efe9" opacity="0.9">What</text>
      <text x="240" y="216" text-anchor="middle" class="venn-center-label" fill="#f0efe9" opacity="0.9">Survives</text>
    </svg>
  </div>

  <div class="quote-main">Three pillars survive when AI can write code on demand.</div>

  <div class="watermark">@defi_naly</div>
</div>

</body>
</html>
