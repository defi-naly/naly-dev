<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Structural Conviction — @defi_naly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #08090c;
      --soil: #0f1014;
      --surface: #161819;
      --border: #1e1c1a;
      --bright: #f0efe9;
      --text: #d4cfc4;
      --muted: #a69b8a;
      --dim: #6b6560;
      --accent: #7ba3c9;
      --accent-bright: #96bade;
      --accent-glow: rgba(123, 163, 201, 0.3);
      --snow: #e8edf4;
      --pine: #3d9970;
      --rock: #6b7a8f;
      --peak: #b8c4d4;
      --gold: #c9a84c;
      --gold-bright: #e2c76e;
      --display: 'Space Grotesk', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--void);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 32px;
    }

    .bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      pointer-events: none;
    }

    .bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0.2;
    }

    .bg-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8, 9, 12, 0.55);
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 800px;
      background: rgba(15, 16, 20, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(123, 163, 201, 0.1);
      border-radius: 16px;
      padding: 48px 52px;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(123, 163, 201, 0.25), transparent);
    }

    .card-label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 12px;
    }

    .card-title {
      font-family: var(--display);
      font-size: 28px;
      font-weight: 600;
      color: var(--bright);
      letter-spacing: -0.02em;
      margin-bottom: 40px;
    }

    /* Conviction rows */
    .rows {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 36px;
    }

    .row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 20px 0;
      border-bottom: 1px solid rgba(30, 28, 26, 0.6);
    }

    .row:last-child {
      border-bottom: none;
    }

    .pip {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 6px;
    }

    .pip.blue { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
    .pip.gold { background: var(--gold); box-shadow: 0 0 8px rgba(201, 168, 76, 0.3); }
    .pip.green { background: var(--pine); box-shadow: 0 0 8px rgba(61, 153, 112, 0.3); }

    .row-content {
      flex: 1;
    }

    .row-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 4px;
    }

    .row-label {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--snow);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .row-stat {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }

    .row-sub {
      font-family: var(--sans);
      font-size: 13px;
      color: var(--dim);
      line-height: 1.5;
      margin-top: 4px;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 4px 0 20px 0;
    }

    /* Footer */
    .card-footer {
      font-family: var(--display);
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      letter-spacing: -0.01em;
    }

    .card-footer strong {
      color: var(--snow);
      font-weight: 500;
    }

    .watermark {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 20px;
      text-align: right;
      opacity: 0.6;
    }
  </style>
</head>
<body>

<div class="bg">
  <img src="1080x360.jpeg" alt="">
  <div class="bg-overlay"></div>
</div>

<div class="card">
  <div class="card-label">Structural Conviction</div>
  <div class="card-title">Two Bets. One Direction.</div>

  <div class="rows">
    <div class="row">
      <div class="pip gold"></div>
      <div class="row-content">
        <div class="row-header">
          <div class="row-label">Hard Money</div>
          <div class="row-stat">3.7% of gold</div>
        </div>
        <div class="row-sub">Bitcoin competing for gold's $35T job. Barely started.</div>
      </div>
    </div>

    <div class="row">
      <div class="pip green"></div>
      <div class="row-content">
        <div class="row-header">
          <div class="row-label">Private Money</div>
          <div class="row-stat">0.3% of BTC</div>
        </div>
        <div class="row-sub">Surveillance grows every year. Demand for financial privacy follows.</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="card-footer">
    Not sized to feel comfortable. <strong>Sized to matter if I'm right.</strong>
  </div>

  <div class="watermark">@defi_naly</div>
</div>

</body>
</html>
