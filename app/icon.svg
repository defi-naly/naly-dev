<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#f2efe8"/>
  <g fill="none" stroke="#1a1916" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top vertex -->
    <line x1="16" y1="4" x2="8" y2="10"/>
    <line x1="16" y1="4" x2="24" y2="10"/>
    <line x1="16" y1="4" x2="11" y2="17"/>
    <line x1="16" y1="4" x2="21" y2="17"/>
    <!-- Upper ring -->
    <line x1="8" y1="10" x2="24" y2="10"/>
    <line x1="8" y1="10" x2="5" y2="19"/>
    <line x1="8" y1="10" x2="11" y2="17"/>
    <line x1="24" y1="10" x2="27" y2="19"/>
    <line x1="24" y1="10" x2="21" y2="17"/>
    <!-- Mid cross braces -->
    <line x1="11" y1="17" x2="21" y2="17"/>
    <line x1="5" y1="19" x2="11" y2="17"/>
    <line x1="27" y1="19" x2="21" y2="17"/>
    <!-- Lower ring -->
    <line x1="5" y1="19" x2="11" y2="26"/>
    <line x1="27" y1="19" x2="21" y2="26"/>
    <line x1="5" y1="19" x2="27" y2="19"/>
    <line x1="11" y1="26" x2="21" y2="26"/>
    <!-- Bottom vertex -->
    <line x1="16" y1="28" x2="11" y2="26"/>
    <line x1="16" y1="28" x2="21" y2="26"/>
    <line x1="16" y1="28" x2="5" y2="19"/>
    <line x1="16" y1="28" x2="27" y2="19"/>
    <!-- Inner diagonals for depth -->
    <line x1="11" y1="17" x2="21" y2="26"/>
    <line x1="21" y1="17" x2="11" y2="26"/>
  </g>
  <!-- Vertex dots for crispness at small sizes -->
  <g fill="#1a1916">
    <circle cx="16" cy="4" r="1"/>
    <circle cx="8" cy="10" r="1"/>
    <circle cx="24" cy="10" r="1"/>
    <circle cx="5" cy="19" r="1"/>
    <circle cx="27" cy="19" r="1"/>
    <circle cx="11" cy="17" r="1"/>
    <circle cx="21" cy="17" r="1"/>
    <circle cx="11" cy="26" r="1"/>
    <circle cx="21" cy="26" r="1"/>
    <circle cx="16" cy="28" r="1"/>
  </g>
</svg>
